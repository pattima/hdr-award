<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#a40018">

  <link rel="canonical" href="https://school-award-report.plan-hdr.chatgpt.site/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a40018'/%3E%3Cpath d='M16 18h8v10h16V18h8v28h-8V35H24v11h-8z' fill='white'/%3E%3C/svg%3E">
  <title>HDR AWARD HUB</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Sarabun", "Noto Sans Thai", system-ui, -apple-system, sans-serif;
      background: #fff8f8;
      color: #2b2022;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 10% 10%, rgba(201, 20, 49, .10), transparent 32rem),
        linear-gradient(145deg, #fff 0%, #fff7f8 100%);
    }

    main {
      width: min(520px, 100%);
      padding: 42px 32px;
      text-align: center;
      background: rgba(255, 255, 255, .92);
      border: 1px solid #f1d5da;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(113, 0, 19, .12);
    }

    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #a40018;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .04em;
      box-shadow: 0 12px 28px rgba(164, 0, 24, .24);
    }

    h1 {
      margin: 0;
      color: #8f0016;
      font-size: clamp(1.6rem, 5vw, 2.15rem);
      line-height: 1.25;
    }

    p {
      margin: 10px 0 24px;
      color: #705d61;
      font-size: 1rem;
      line-height: 1.7;
    }

    .loader {
      width: 34px;
      height: 34px;
      margin: 0 auto 24px;
      border: 4px solid #f3d6dc;
      border-top-color: #a40018;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    a {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      border-radius: 12px;
      background: #a40018;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #ef8fa0;
      outline-offset: 4px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .loader { animation: none; }
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" aria-hidden="true">HDR</div>
    <h1>HDR AWARD HUB</h1>
    <p>กำลังเปิดระบบสารสนเทศผลงานและรางวัล<br>โรงเรียนหางดงรัฐราษฎร์อุปถัมภ์</p>
    <div class="loader" aria-hidden="true"></div>
    <a href="https://school-award-report.plan-hdr.chatgpt.site/">กดที่นี่ หากระบบไม่เปิดอัตโนมัติ</a>
  </main>

  <script>
    window.setTimeout(function () {
      window.location.replace("https://school-award-report.plan-hdr.chatgpt.site/");
    }, 250);
  </script>
</body>
</html>
